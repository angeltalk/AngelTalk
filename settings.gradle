pluginManagement {
    repositories {
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex "com\\.android.*"
                includeGroupByRegex "com\\.google.*"
                includeGroupByRegex "androidx.*"
            }
        }
        mavenCentral()
    }
}

// Allows Gradle to auto-provision JVM toolchains (e.g. JDK 17 for the unit-test JVM).
// Needed because Robolectric 4.13 + JaCoCo 0.8.12 cannot read Java 25 bytecode, so
// unit tests must run under an older JDK than the host's SDKMAN JDK 25.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'AngelTalk'
include ':app'
